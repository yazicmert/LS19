# Haftalık: halka açık CelesTrak geçmişinden uydu yörünge özetini (web/data/gecmis.json) yeniler ve değiştiyse main'e işler.
# Space-Track kullanılmaz. Elle de çalıştırılabilir (Actions > "Geçmiş yörünge verisini yenile" > Run workflow).
name: Geçmiş yörünge verisini yenile

on:
  schedule:
    - cron: '17 3 * * 1'        # her pazartesi 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gecmis
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geçmiş özetini üret (son ~14 ay, 7 günde bir örnek)
        run: node tools/gecmis_derle.mjs --adim-gun 7 --pencere-gun 425 --onbellek "$RUNNER_TEMP/gecmis"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Modelleri sına
        run: node web/test/test_impact.js
      - name: Değiştiyse işle ve gönder
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/gecmis.json
          if git diff --cached --quiet; then echo "değişiklik yok"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Geçmiş yörünge verisi yenilendi ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Vercel, bot işlemelerinde dağıtımı başlatmayabilir; bir Deploy Hook adresi 'VERCEL_DEPLOY_HOOK' gizli değişkeni olarak tanımlıysa tetiklenir
      - name: Vercel dağıtımını tetikle (isteğe bağlı)
        if: steps.commit.outputs.pushed == 'true' && env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
