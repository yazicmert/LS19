# Her PR'da ve main'e her gönderimde: kod denetimi (ESLint: tanımsız ad, kullanılmayan değişken/içe aktarma) ve tüm Node testleri.
# LS19 derleme gerektirmez (Vercel web/ klasörünü olduğu gibi yayınlar). lookstar19 (site/, Next.js) ayrı işte derlenir: Vercel'in
# yapacağı derlemenin aynısı (npm ci, modeller, next build); kırılan site PR'da görünür. İşler yalnız denetler, hiçbir şey yazmaz.
name: Denetim

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4          # sabit: bit düzeyi testler (nominal Δv) V8 sürümüne bağlı; Node 24 Math.pow farklı, veri yeniden üretilmeli
          cache: npm
      - name: Bağımlılıklar (yalnız ESLint)
        run: npm ci
      - name: Kod denetimi
        run: npm run lint
      - name: Varlıklar (GitHub Release)
        run: node tools/varliklar.mjs indir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Testler
        run: npm test

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Bağımlılıklar
        run: npm ci
      - name: Derleme (modeller sürüm paketinden, özet denetimli)
        run: npm run build
      - name: Sayfalar
        run: |
          test -f .next/server/app/en.html && test -f .next/server/app/tr/asteroids/bennu.html
          echo "$(find .next/server/app -name '*.html' | wc -l) sayfa"
